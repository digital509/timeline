<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>From the Resurrection to Nicaea</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <header class="masthead">
      <h1>The Age of Witness</h1>
      <p>From the resurrection to the Council of Nicaea</p>
      <div id="era-switch" class="era-switch" role="tablist" aria-label="Dating scheme">
        <button type="button" role="tab" data-era="critic">Critical dates</button>
        <button type="button" role="tab" data-era="early" aria-selected="true">Early dates</button>
      </div>
      <p class="era-note">The line moves with the dating scheme. Habermas and Huff still speak in the cards.</p>
    </header>
    <div id="scroller">
      <div id="track">
        <div id="spine"></div>
        <svg id="links"></svg>
        <div id="events"></div>
      </div>
    </div>
    <p class="hint-scroll">
      <span class="hint-desktop">Drag the years · click a disk · wheel zooms</span>
      <span class="hint-compact">Swipe the years · tap a disk · pinch to zoom</span>
    </p>
  </div>
  <div id="sheet" class="sheet" aria-hidden="true">
    <button type="button" class="sheet-backdrop" aria-label="Close details"></button>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <button type="button" class="sheet-close" aria-label="Close">Close</button>
      <div id="sheet-content"></div>
    </div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
